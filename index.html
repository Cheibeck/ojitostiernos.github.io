<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdf9" />
    <meta
      name="description"
      content="Creaciones artesanales tejidas a mano, con paciencia y mucho cariño. Descubre la colección de Ojitos Tiernos."
    />
    <title>Ojitos Tiernos</title>
  </head>
  <body>
    <div id="root" data-base="%BASE_URL%"></div>
    <script>
      const route = new URLSearchParams(window.location.search).get('route')
      if (route !== null) {
        const base = document.getElementById('root').dataset.base
        window.history.replaceState(null, '', `${base}${route}`)
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
